<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForeverLink.love - 爱的永恒链接</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
</head>
<body>
    <!-- 粒子背景 -->
    <div id="particles-js"></div>
    
    <!-- 3D Canvas -->
    <canvas id="three-canvas"></canvas>
    
    <!-- 主内容 -->
    <div class="container">
        <!-- 标题动画 -->
        <div class="title-section">
            <h1 class="main-title">
                <span class="letter">F</span>
                <span class="letter">o</span>
                <span class="letter">r</span>
                <span class="letter">e</span>
                <span class="letter">v</span>
                <span class="letter">e</span>
                <span class="letter">r</span>
                <span class="heart-icon">❤️</span>
                <span class="letter">L</span>
                <span class="letter">i</span>
                <span class="letter">n</span>
                <span class="letter">k</span>
            </h1>
            <p class="subtitle">爱的永恒链接</p>
        </div>
        
        <!-- 3D心形链接 -->
        <div class="heart-container">
            <div class="heart-wrapper">
                <div class="heart heart-left">
                    <div class="heart-inner"></div>
                </div>
                <div class="chain-container">
                    <svg class="chain" viewBox="0 0 400 100">
                        <path id="chain-path" d="M 50 50 Q 200 20 350 50" fill="none" stroke="url(#gradient)" stroke-width="3"/>
                        <defs>
                            <linearGradient id="gradient">
                                <stop offset="0%" stop-color="#ff6b9d"/>
                                <stop offset="50%" stop-color="#ffd93d"/>
                                <stop offset="100%" stop-color="#ff6b9d"/>
                            </linearGradient>
                        </defs>
                        <!-- 链条元素 -->
                        <g class="chain-links"></g>
                    </svg>
                </div>
                <div class="heart heart-right">
                    <div class="heart-inner"></div>
                </div>
            </div>
        </div>
        
        <!-- 无限符号 -->
        <div class="infinity-container">
            <svg class="infinity" viewBox="0 0 200 80">
                <path d="M 50,40 C 50,20 30,20 30,40 C 30,60 50,60 50,40 C 50,60 70,60 70,40 C 70,20 50,20 50,40 
                         C 50,40 130,40 130,40 C 130,20 110,20 110,40 C 110,60 130,60 130,40 C 130,60 150,60 150,40 C 150,20 130,20 130,40"
                      stroke="url(#infinity-gradient)" stroke-width="3" fill="none"/>
                <defs>
                    <linearGradient id="infinity-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#e94057;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#f27121;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#e94057;stop-opacity:1" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
        
        <!-- 爱的宣言 -->
        <div class="love-declaration">
            <p class="declaration-text">
                <span class="word">两颗心</span>
                <span class="word">一条链</span>
                <span class="word">永恒连接</span>
                <span class="word">直到永远</span>
            </p>
        </div>
        
        <!-- 交互按钮 -->
        <div class="interactive-section">
            <button class="love-button" id="createLink">
                <span class="button-text">创建永恒链接</span>
                <span class="button-particles"></span>
            </button>
        </div>
        
    <!-- 浮动爱心 -->
    <div class="floating-hearts" id="floatingHearts"></div>
    
    <!-- 名字输入模态框 -->
    <div class="modal" id="nameModal">
        <div class="modal-content">
            <h2>创建你们的永恒链接</h2>
            <div class="input-group">
                <input type="text" id="name1" placeholder="输入第一个名字" maxlength="20">
                <span class="heart-divider">❤️</span>
                <input type="text" id="name2" placeholder="输入第二个名字" maxlength="20">
            </div>
            <button id="generateLink" class="generate-btn">生成永恒链接</button>
        </div>
    </div>
    
    <!-- 生成的永恒链接展示 -->
    <div class="eternal-link-display" id="eternalLinkDisplay">
        <h3 class="link-title">你们的永恒链接</h3>
        <div class="names-display" id="namesDisplay"></div>
        <div class="link-url" id="linkUrl"></div>
    </div>
    </div>
    
    <!-- 光晕效果 -->
    <div class="light-rays">
        <div class="ray ray-1"></div>
        <div class="ray ray-2"></div>
        <div class="ray ray-3"></div>
        <div class="ray ray-4"></div>
    </div>
    
    <!-- 脚本 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/MotionPathPlugin.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anime/3.2.1/anime.min.js"></script>
    <script src="script.js"></script>
    <script src="advanced-effects.js"></script>
</body>
</html>
