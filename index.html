<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForeverLink - Anime.js Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 主标题动画 -->
    <section class="hero">
        <div class="title-container">
            <h1 class="main-title">
                <span class="letter">F</span>
                <span class="letter">o</span>
                <span class="letter">r</span>
                <span class="letter">e</span>
                <span class="letter">v</span>
                <span class="letter">e</span>
                <span class="letter">r</span>
                <span class="letter">L</span>
                <span class="letter">i</span>
                <span class="letter">n</span>
                <span class="letter">k</span>
            </h1>
            <p class="subtitle">Life Connected Forever</p>
        </div>
    </section>

    <!-- 点阵网格 -->
    <section class="grid-section">
        <div class="grid-container"></div>
    </section>

    <!-- 演示卡片 -->
    <section class="demos">
        <div class="demo-card" id="demo1">
            <div class="demo-content">
                <div class="square"></div>
            </div>
            <h3>Transform</h3>
        </div>
        
        <div class="demo-card" id="demo2">
            <div class="demo-content">
                <div class="circles-container"></div>
            </div>
            <h3>Stagger</h3>
        </div>
        
        <div class="demo-card" id="demo3">
            <div class="demo-content">
                <div class="timeline-dots"></div>
            </div>
            <h3>Timeline</h3>
        </div>
        
        <div class="demo-card" id="demo4">
            <div class="demo-content">
                <svg class="morph-svg" viewBox="0 0 100 100">
                    <path class="morph-path" d="M 25,50 Q 50,25 75,50 T 25,50" />
                </svg>
            </div>
            <h3>SVG Morph</h3>
        </div>
    </section>

    <!-- 交互区域 -->
    <section class="interactive">
        <div class="interactive-container">
            <div class="follow-cursor"></div>
            <div class="click-ripple"></div>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
