<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForeverLink.love - 生活的永恒链接</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
</head>
<body>
    <!-- 3D 记忆网络背景 -->
    <canvas id="memory-network"></canvas>
    
    <!-- 时间流动层 -->
    <div id="time-flow"></div>
    
    <!-- 主容器 -->
    <div class="container">
        <!-- 标题区域 -->
        <header class="header">
            <h1 class="title">Forever<span class="highlight">Link</span></h1>
            <p class="subtitle">生活的点滴，串联成永恒的记忆链</p>
        </header>
        
        <!-- 时间轴主体 -->
        <div class="timeline-container" id="timelineContainer">
            <!-- 中央连接线 -->
            <div class="connection-line"></div>
            
            <!-- 记忆节点将动态生成 -->
            <div class="memory-nodes" id="memoryNodes"></div>
        </div>
        
        <!-- 交互式记忆创建器 -->
        <div class="memory-creator">
            <button class="add-memory-btn" id="addMemoryBtn">
                <span class="btn-text">添加记忆片段</span>
                <span class="btn-icon">+</span>
            </button>
        </div>
        
        <!-- 记忆详情查看器 -->
        <div class="memory-viewer" id="memoryViewer">
            <div class="viewer-content">
                <div class="viewer-date"></div>
                <div class="viewer-title"></div>
                <div class="viewer-description"></div>
                <div class="viewer-connections"></div>
            </div>
        </div>
        
        <!-- 浮动的记忆碎片 -->
        <div class="floating-memories" id="floatingMemories"></div>
        
        <!-- 连接可视化层 -->
        <svg class="connections-svg" id="connectionsSvg">
            <defs>
                <linearGradient id="link-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#6B46C1;stop-opacity:0.6" />
                    <stop offset="50%" style="stop-color:#9333EA;stop-opacity:0.8" />
                    <stop offset="100%" style="stop-color:#6B46C1;stop-opacity:0.6" />
                </linearGradient>
            </defs>
        </svg>
    </div>
    
    <!-- 记忆输入模态框 -->
    <div class="modal" id="memoryModal">
        <div class="modal-content">
            <h2>记录生活片段</h2>
            <form id="memoryForm">
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" id="memoryDate" required>
                </div>
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" id="memoryTitle" placeholder="给这个记忆起个名字..." required>
                </div>
                <div class="form-group">
                    <label>类型</label>
                    <select id="memoryType">
                        <option value="moment">瞬间</option>
                        <option value="milestone">里程碑</option>
                        <option value="daily">日常</option>
                        <option value="travel">旅行</option>
                        <option value="celebration">庆祝</option>
                        <option value="challenge">挑战</option>
                        <option value="growth">成长</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="memoryDescription" rows="4" placeholder="记录这个时刻的细节..."></textarea>
                </div>
                <div class="form-group">
                    <label>关联标签（用逗号分隔）</label>
                    <input type="text" id="memoryTags" placeholder="例如：咖啡, 雨天, 音乐">
                </div>
                <div class="form-buttons">
                    <button type="button" class="btn-cancel" id="cancelMemory">取消</button>
                    <button type="submit" class="btn-save">保存记忆</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- 欢迎引导 -->
    <div class="welcome-guide" id="welcomeGuide">
        <div class="guide-content">
            <h2>欢迎来到 ForeverLink</h2>
            <p>每一个记忆都是生活的节点<br>每一条连接都是情感的延续</p>
            <p class="guide-instruction">点击"添加记忆片段"开始记录你的故事</p>
            <button class="guide-close" id="closeGuide">开始探索</button>
        </div>
    </div>
    
    <!-- 脚本 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="memory-system.js"></script>
    <script src="visual-effects.js"></script>
</body>
</html>
